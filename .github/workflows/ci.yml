name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Create local build configuration
        run: ./ci_scripts/ci_post_clone.sh

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project TelescaniOS.xcodeproj \
            -scheme Telescan

      - name: Select simulator
        id: simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          SIMULATOR_ID="$(python3 -c '
          import json, os
          with open(os.environ["RUNNER_TEMP"] + "/devices.json") as stream:
              devices = json.load(stream)["devices"]
          print(next(
              device["udid"]
              for runtime in sorted(devices, reverse=True)
              if "iOS" in runtime
              for device in devices[runtime]
              if device["name"].startswith("iPhone")
          ))
          ')"
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          xcodebuild test \
            -project TelescaniOS.xcodeproj \
            -scheme Telescan \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath "$RUNNER_TEMP/TelescanTests" \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive unsigned Release for device
        run: |
          xcodebuild archive \
            -project TelescaniOS.xcodeproj \
            -scheme 'Telescan Release' \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Telescan.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/TelescanRelease" \
            CODE_SIGNING_ALLOWED=NO

      - name: Validate production Release archive
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/Telescan.xcarchive"
          APP="$ARCHIVE/Products/Applications/Telescan.app"
          PLIST="$APP/Info.plist"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :API_ORIGIN' "$PLIST")" = \
            'https://api.tgtelescan.ru'
          test "$(/usr/libexec/PlistBuddy -c 'Print :TELESCAN_BOT' "$PLIST")" = \
            'https://t.me/tgtelescan_bot'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = \
            'hiTeam.TelescaniOS'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$PLIST")" = \
            'APPL'
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PLIST")" = \
            '17.6'
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$PLIST")" = \
            '1'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$PLIST")" = \
            'iPhoneOS'
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$PLIST")" = \
            'bluetooth-central'
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:1' "$PLIST")" = \
            'bluetooth-peripheral'
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)*$ ]]
          [[ "$BUILD" =~ ^[0-9]+([.][0-9]+)*$ ]]
          test "$(/usr/libexec/PlistBuddy \
            -c 'Print :com.apple.developer.applesignin:0' \
            TelescaniOS/TelescaniOS.entitlements)" = 'Default'
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/en.lproj/InfoPlist.strings"
          test -f "$APP/ru.lproj/InfoPlist.strings"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")"
          EXECUTABLE="$APP/$EXECUTABLE_NAME"
          test -f "$EXECUTABLE"
          test "$(lipo -archs "$EXECUTABLE")" = 'arm64'
          DSYM="$ARCHIVE/dSYMs/$EXECUTABLE_NAME.app.dSYM"
          test -d "$DSYM"
          APP_UUID="$(dwarfdump --uuid "$EXECUTABLE" | awk '{print $2}')"
          DSYM_UUID="$(dwarfdump --uuid "$DSYM" | awk '{print $2}')"
          test -n "$APP_UUID"
          test "$APP_UUID" = "$DSYM_UUID"
          test -z "$(strings "$EXECUTABLE" | grep -E \
            'localhost|linkForDevelopment|/api/v1/auth/link|TELESCAN_PERSONAL_TEAM' \
            || true)"
          test ! -f "$APP/embedded.mobileprovision"
          test -z "$(find "$APP" \
            \( -name '.gitignore' \
            -o -name '.swiftlint.yml' \
            -o -name 'project.yml' \
            -o -name '*.xcconfig' \) -print -quit)"
